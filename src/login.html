<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · AVA Turn Board</title><meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AVA Turn"><link rel="stylesheet" href="/styles.css"></head><body class="auth-page"><main class="auth-card"><p class="auth-brand">AVA NAIL BAR</p><h1 id="auth-title">Đăng nhập bảng turn</h1><p id="auth-description">Dùng tài khoản của tiệm để xem và chỉnh chung bảng trên các thiết bị.</p><form id="auth-form"><label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" maxlength="40" autocapitalize="none" spellcheck="false" required><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><div id="confirm-field" hidden><label for="confirm-password">Nhập lại mật khẩu</label><input id="confirm-password" type="password" autocomplete="new-password" maxlength="128"></div><div id="setup-key-field" hidden><label for="setup-key">Mã thiết lập</label><input id="setup-key" type="password" autocomplete="off" maxlength="256" spellcheck="false" placeholder="Mã bí mật do chủ tiệm giữ"></div><label id="remember-field" class="remember-label"><input id="remember-login" type="checkbox" name="remember"><span>Ghi nhớ đăng nhập trên thiết bị này (30 ngày)</span></label><p id="auth-status" role="status" aria-live="polite">Đang kết nối…</p><button id="auth-submit" type="submit" disabled>Đăng nhập</button></form><p class="auth-owner"><a id="setup-link" href="/setup" target="_top">Chủ tiệm: thiết lập / đổi mật khẩu</a><a id="back-login" href="/login" hidden>Trở về đăng nhập</a></p></main><script src="/auth-ui.js"></script></body></html>
