<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · AVA Turn Board</title><meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AVA Turn"><link rel="stylesheet" href="/styles.css"></head><body class="auth-page"><main class="auth-card"><p class="auth-brand">AVA NAIL BAR</p><h1 id="auth-title">Sign in to the turn board</h1><p id="auth-description">Use the salon account to view and edit the shared board across devices.</p><form id="auth-form"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="40" autocapitalize="none" spellcheck="false" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><div id="confirm-field" hidden><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" maxlength="128"></div><div id="setup-key-field" hidden><label for="setup-key">Setup key</label><input id="setup-key" type="password" autocomplete="off" maxlength="256" spellcheck="false" placeholder="Secret key kept by the owner"></div><label id="remember-field" class="remember-label"><input id="remember-login" type="checkbox" name="remember"><span>Keep me signed in on this device (30 days)</span></label><p id="auth-status" role="status" aria-live="polite">Connecting…</p><button id="auth-submit" type="submit" disabled>Sign in</button></form><p class="auth-owner"><a id="setup-link" href="/setup" target="_top">Owner: set up / change password</a><a id="back-login" href="/login" hidden>Back to sign in</a></p></main><script src="/auth-ui.js"></script></body></html>
