# Cloudflare Workers configuration for AVA Turn Board.
# Deploy gives you a free https://<name>.<your-subdomain>.workers.dev link.
name = "ava-turn-board"
main = "dist/worker.js"
compatibility_date = "2024-11-01"

# Publish on the free *.workers.dev subdomain.
workers_dev = true

# Build the bundle before every deploy (so `wrangler deploy` and the browser
# "Deploy to Cloudflare" flow both produce dist/worker.js automatically).
[build]
command = "npm install && npm run build"

# Daily auto-reset (clears today's turns at 9 AM Chicago; see scheduled() in worker).
# Fires at 14:00 and 15:00 UTC; the handler acts only at the 9 AM Chicago hour (DST-safe).
[triggers]
crons = ["0 14 * * *", "0 15 * * *"]

# D1 database binding.
# - Browser "Deploy to Cloudflare": leave database_id empty; Cloudflare
#   provisions the database and fills the id automatically.
# - CLI (./deploy.sh): the script creates the database and writes its id here.
[[d1_databases]]
binding = "DB"
database_name = "ava-turn-board"
database_id = "34dab9a0-6fa4-416c-94f8-1d185bc975c4"
migrations_dir = "migrations"

# OWNER_SETUP_KEY is a *secret*, never put it here. Set it with:
#   wrangler secret put OWNER_SETUP_KEY
